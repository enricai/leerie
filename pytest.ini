[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts = -ra --strict-markers --strict-config
markers =
    real_heldout_sandbox: the test's subject is the held-out sandbox or its preflight gate: opts out of conftest's _emulated_heldout_sandbox (the emulator stands in for the shim's --sandbox) and _no_real_heldout_sandbox (the stub of _require_heldout_sandbox). Such tests skip where isolation_error() says the host cannot build one.
    real_planning_worktree: let a test call the real _ensure_planning_worktree (which does a real `git worktree add`). Opts out of conftest's _no_real_planning_worktree guard; only for tests whose subject IS the worktree mechanics.
