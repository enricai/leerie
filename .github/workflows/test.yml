# Runs pytest across the supported Python matrix on every PR and on
# pushes to main. Coverage is reported (no gate) per CLAUDE.md's stance
# on coverage targets.
name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # Raised from 10 on 2026-08-19. Observed runtime had reached
    # 7.9-9.7 min against the old 10 min cap, so a fully green suite
    # was one slow runner away from failing on the timeout rather than
    # on a test.
    #
    # Raised again from 20 on 2026-11-03: on PR #297 all three matrix
    # legs (3.10/3.11/3.12) reported "Cancelled after 20m" — killed by
    # this cap, not by a failing test. 40 was an estimate, and it was
    # wrong: runs 41732738003 and 41756388905 were both cancelled at
    # 40.3 min.
    #
    # Raised to 120 on 2026-11-04, this time against measurement rather
    # than a guess. At the 40 min cut the py3.12 leg was only at 48% and
    # still emitting steady per-file progress — a slow suite, not a hung
    # test — which extrapolates to a full run of roughly 75-85 min. 60
    # would have been cancelled too; 120 leaves about 1.5x headroom.
    # (GitHub's own job ceiling is 360 min.)
    #
    # The underlying regression is NOT addressed here: the last green
    # run, 40607416970 on 2026-10-28, finished in ~14-15 min, so the
    # suite grew roughly 5x across #296/#297. The single costliest file
    # is tests/test_acceptance_held_case_intermittent.py at 435s. There
    # is no pytest-timeout, so nothing bounds an individual test and a
    # real hang would look exactly like this.
    # Headroom, not a licence to let the suite grow.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: tests/test_release_workflow.py walks every
          # `chore(release):` subject on the repo. The default fetch-depth: 1
          # (shallow, detached HEAD, no `main` ref) makes that test fail — do
          # not shrink this back without updating that test.
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov jsonschema

      # The AST-script tests (scripts/test-case-facts.cjs in
      # tests/test_delivery_detection.py, scripts/redrive-ast-gate.cjs in
      # tests/test_delivery_redrive.py) need `typescript`: in a run it comes
      # from the target repo's install or the image's bundled copy, neither of
      # which a CI host has. Without this step they skip and CI never runs
      # them; the tests also use this copy as the stand-in bundled one. The runner image's own
      # node runs the scripts; the package is pinned and kept outside the
      # checkout so no package.json enters the repo.
      - name: Install typescript for the AST-script tests
        run: |
          node --version
          npm install --no-save --no-package-lock --prefix "$RUNNER_TEMP/ts" typescript@5.9.3
          echo "LEERIE_TEST_TYPESCRIPT_DIR=$RUNNER_TEMP/ts/node_modules/typescript" >> "$GITHUB_ENV"

      - name: Syntax check (from CLAUDE.md task-completion checklist)
        run: python -c "import ast; ast.parse(open('orchestrator/leerie.py').read())"

      - name: Set git identity (CI runners have no global config)
        run: |
          git config --global user.email "ci@leerie.invalid"
          git config --global user.name "Leerie CI"

      - name: Run tests with coverage
        run: pytest tests/ -ra --cov=orchestrator --cov-report=term --cov-report=xml

      - name: Coverage summary
        if: always()
        run: |
          python -c "
          import xml.etree.ElementTree as ET, os, sys
          summary = os.environ.get('GITHUB_STEP_SUMMARY')
          pyver = '${{ matrix.python-version }}'
          try:
              root = ET.parse('coverage.xml').getroot()
              rate = float(root.get('line-rate', '0')) * 100
              covered = root.get('lines-covered', '?')
              valid = root.get('lines-valid', '?')
              line = f'### Coverage (py{pyver})\n- Line coverage: **{rate:.1f}%** ({covered}/{valid})\n'
          except Exception as exc:
              line = f'### Coverage (py{pyver})\n- could not parse coverage.xml: {exc}\n'
          if summary:
              open(summary, 'a').write(line)
          else:
              sys.stdout.write(line)
          " || true

      - name: Upload coverage artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 7
