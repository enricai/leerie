# Runs pytest across the supported Python matrix on every PR and on
# pushes to main. Coverage is reported (no gate) per CLAUDE.md's stance
# on coverage targets.
name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # History: 10 min until 2026-08-19, then 20, 40 and 120 as the suite
    # outgrew each (PR #297's legs and runs 41732738003 / 41756388905 were
    # cancelled by the cap, not by a test).
    #
    # Lowered to 60 on 2026-11-04, after the cause was found rather than
    # outrun. Run 41777003910 (serial, no per-test bound) measured, per leg,
    # the time from the step's start to its first test and then to its last:
    #   py3.10  48.5 min before the first test, cancelled at 120 at 96%
    #   py3.11  29.1 min before the first test, 82.9 min in all
    #   py3.12   2.8 min before the first test, 69.4 min in all
    # The time before the first test was collection:
    # tests/test_needs_human_sources_render.py derived its parameters at
    # import with one `ast.get_source_segment` per function of leerie.py,
    # and that call re-splits the whole 3.5 MB module in a pure-Python loop
    # on 3.10/3.11 (measured on 3.11: 0.9 s a call, about 26 min for the
    # module's ~1,700 functions). Tests now split once
    # (`tests/conftest.py::source_segments`), so that cost is gone from
    # every leg. What remains is about 54-74 min of test execution
    # serially; `-n 4` runs it on this runner's 4 vCPUs. 60 min is about
    # twice what that leaves if the 4 workers achieve only a 3x speedup, and
    # still below the 69 min that a serial 3.12 leg needed: a suite that
    # drifts back to serial speed fails here, at a timeout, rather than
    # passing slowly.
    #
    # `--timeout=600` bounds each test, so a hang fails one named test
    # instead of the job, and conftest kills whatever the test started.
    # The slowest legitimate test measured locally under `-n 4` was 150 s
    # (tests/test_delivery_ratchet.py, on a host at load 50-90 / 32 cores);
    # 600 is 4x that, and 6x below this job's own bound. Two that ran 559 s
    # and 600 s were waiting on the host's CPU pressure, not working:
    # conftest's `_quiet_host_pressure` took that wait out (45 s, 36 s).
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: tests/test_release_workflow.py walks every
          # `chore(release):` subject on the repo. The default fetch-depth: 1
          # (shallow, detached HEAD, no `main` ref) makes that test fail — do
          # not shrink this back without updating that test.
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-timeout pytest-xdist jsonschema

      # The AST-script tests (scripts/test-case-facts.cjs in
      # tests/test_delivery_detection.py, scripts/redrive-ast-gate.cjs in
      # tests/test_delivery_redrive.py) need `typescript`: in a run it comes
      # from the target repo's install or the image's bundled copy, neither of
      # which a CI host has. Without this step they skip and CI never runs
      # them; the tests also use this copy as the stand-in bundled one. The runner image's own
      # node runs the scripts; the package is pinned and kept outside the
      # checkout so no package.json enters the repo.
      - name: Install typescript for the AST-script tests
        run: |
          node --version
          npm install --no-save --no-package-lock --prefix "$RUNNER_TEMP/ts" typescript@5.9.3
          echo "LEERIE_TEST_TYPESCRIPT_DIR=$RUNNER_TEMP/ts/node_modules/typescript" >> "$GITHUB_ENV"

      - name: Syntax check (from CLAUDE.md task-completion checklist)
        run: python -c "import ast; ast.parse(open('orchestrator/leerie.py').read())"

      - name: Set git identity (CI runners have no global config)
        run: |
          git config --global user.email "ci@leerie.invalid"
          git config --global user.name "Leerie CI"

      - name: Run tests with coverage
        run: pytest tests/ -n 4 --timeout=600 -ra --cov=orchestrator --cov-report=term --cov-report=xml

      - name: Coverage summary
        if: always()
        run: |
          python -c "
          import xml.etree.ElementTree as ET, os, sys
          summary = os.environ.get('GITHUB_STEP_SUMMARY')
          pyver = '${{ matrix.python-version }}'
          try:
              root = ET.parse('coverage.xml').getroot()
              rate = float(root.get('line-rate', '0')) * 100
              covered = root.get('lines-covered', '?')
              valid = root.get('lines-valid', '?')
              line = f'### Coverage (py{pyver})\n- Line coverage: **{rate:.1f}%** ({covered}/{valid})\n'
          except Exception as exc:
              line = f'### Coverage (py{pyver})\n- could not parse coverage.xml: {exc}\n'
          if summary:
              open(summary, 'a').write(line)
          else:
              sys.stdout.write(line)
          " || true

      - name: Upload coverage artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 7
