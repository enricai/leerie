# Lints the worktree mechanics scripts and the remote (Fly/EC2) surface.
# These are load-bearing (DESIGN §6) but small, so the built-in shellcheck
# on the runner is sufficient — no third-party action needed.
name: shellcheck

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**/*.sh'
      - '.github/workflows/shellcheck.yml'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/**/*.sh'
      - '.github/workflows/shellcheck.yml'

concurrency:
  group: shellcheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: shellcheck version
        run: shellcheck --version

      # Both trees. The glob was `scripts/*.sh` — a single level — while the
      # trigger above matches `scripts/**/*.sh`, so the 19 scripts under
      # scripts/remote/ fired the job and were then never linted. That gap hid
      # the whole remote surface, including the one place `claude -p` is
      # invoked from shell (collect-subtrees.sh), from the only linter that
      # catches the backtick-in-a-comment class `bash -n` cannot see.
      - name: Run shellcheck on scripts/ and scripts/remote/
        run: shellcheck -x scripts/*.sh scripts/remote/*.sh

      - name: Summary
        if: always()
        run: |
          {
            echo "### shellcheck"
            echo "- Ran \`shellcheck -x scripts/*.sh scripts/remote/*.sh\`"
            echo "- Status: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
