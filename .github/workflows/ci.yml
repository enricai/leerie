# No linter by design — CLAUDE.md § Code style is the contract, enforced by review.
name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dev dependency
        run: pip install pytest

      - name: Syntax check (from CLAUDE.md task-completion checklist)
        run: python -c "import ast; ast.parse(open('orchestrator/centella.py').read())"

      - name: Run tests
        run: pytest tests/ -ra
