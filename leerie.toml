# Dogfooding: this repo's basename is `leerie`, so the launcher default
# would resolve to $HOME/.leerie/leerie, which is the installer's own
# `leerie` executable when leerie was installed by its installer. Set
# LEERIE_STATE_DIR=~/.leerie/_self (or pass --state-dir) when running leerie
# on this repo. It can no longer be set here: a repository's leerie.toml
# never names a host path (DESIGN §6 *No host path comes from a
# repository*), and a `state_dir` key stops the launcher.

# Effort defaults lowered high→medium after the Opus 5 release to cut per-call
# output-token volume (Opus 5 thinks by default and emits ~+50% more output
# tokens than Opus 4.8 at the same effort, driving OTPM rate-limit pressure).
# Leerie's downstream checks absorb the small per-worker quality reduction; see
# IMPLEMENTATION.md §2 "Effort selection". These per-worker keys mirror the
# EFFORT_DEFAULT_PER_WORKER code default so the intent is explicit for this repo
# and survives even if the code default is later changed. (pr_writer and
# dep_capture honor only the global `effort` key, not per-worker keys, so they
# take medium from the code default — do NOT add a global `effort` key here,
# which would also pull the acting workers off their intended unset profile.)
effort_classifier = "medium"
effort_planner = "medium"
effort_reconciler = "medium"
effort_plan_overlap_judge = "medium"
effort_provision = "medium"
effort_integrator = "medium"
effort_fit_judge = "medium"
effort_splitter = "medium"
effort_adherence_judge = "medium"
